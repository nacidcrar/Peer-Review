# Resubmit to retrigger workflow
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Extract repository information
        id: repo-info
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          GITHUB_USERNAME="${GITHUB_REPOSITORY%/*}"
          
          # Determine basePath based on repository name
          if [ "$REPO_NAME" = "${GITHUB_USERNAME}.github.io" ]; then
            BASE_PATH=""
            echo "basePath=empty" >> $GITHUB_OUTPUT
            echo "Repository is username.github.io, basePath will be empty"
          else
            BASE_PATH="/${REPO_NAME}"
            echo "basePath=${BASE_PATH}" >> $GITHUB_OUTPUT
            echo "Repository is ${REPO_NAME}, basePath will be ${BASE_PATH}"
          fi
          
          echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_ENV
          echo "GITHUB_USERNAME=${GITHUB_USERNAME}" >> $GITHUB_ENV
          echo "REPO_BASEPATH=${BASE_PATH}" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate ABI
        working-directory: ./frontend
        run: npm run genabi

      - name: Build Next.js application
        working-directory: ./frontend
        env:
          NEXT_EXPORT: "true"
          REPO_NAME: ${{ env.REPO_NAME }}
          GITHUB_USERNAME: ${{ env.GITHUB_USERNAME }}
          REPO_BASEPATH: ${{ env.REPO_BASEPATH }}
        run: npm run build:export

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

